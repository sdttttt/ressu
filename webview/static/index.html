<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ressu</title>
    <link rel="stylesheet" href="./reader.css" />
  </head>
  <body>
    <main id="reader" aria-live="polite">
      <section id="empty" class="reader-state" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M4 11a9 9 0 0 1 9 9" />
          <path d="M4 4a16 16 0 0 1 16 16" />
          <circle cx="5" cy="19" r="1" />
        </svg>
        <h2>选择一篇文章</h2>
        <p>左侧列表里的文章会显示在这里。</p>
      </section>
      <div id="article" hidden></div>
    </main>
    <div id="snapshot-backdrop" hidden>
      <section id="snapshot-dialog" role="dialog" aria-modal="true" aria-labelledby="snapshot-title">
        <div id="snapshot-progress" hidden>
          <span class="snapshot-spinner" aria-hidden="true"></span>
          <p id="snapshot-progress-text">正在生成文章快照…</p>
        </div>
      </section>
    </div>
    <script src="./reader.js"></script>
  </body>
</html>
