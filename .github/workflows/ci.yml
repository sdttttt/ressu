name: ci

on:
  push:
    branches: [master, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install the frontend's dependencies
        run: bun install --frozen-lockfile

      - name: Go tests
        run: go test ./...

      - name: Generate the TypeScript client
        run: bun run generate

      - name: Type check, lint and format
        run: bun run check

      - name: Frontend tests
        run: bun run test

      - name: Build the frontend
        run: bun run build:web

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: ubuntu-latest
            platform: linux/amd64
          - os: macos-latest
            platform: darwin/universal
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1

      - name: Install the frontend's dependencies
        run: bun install --frozen-lockfile

      - name: Package
        run: bun run build -- -platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: ressu-${{ runner.os }}
          path: build/
          if-no-files-found: error
