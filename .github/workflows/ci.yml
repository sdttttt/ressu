name: ci

on:
  push:
    branches: [master, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install the frontend's dependencies
        run: bun install --frozen-lockfile --registry https://registry.npmjs.org/

      - name: Go tests
        run: go test ./...

      - name: Generate the TypeScript client
        run: bun run generate

      - name: Type check, lint and format
        run: bun run check

      - name: Frontend tests
        run: bun run test

      - name: Build the frontend
        run: bun run build:web

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: ubuntu-latest
            platform: linux/amd64
          - os: macos-latest
            platform: darwin/universal
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1

      - name: Install the frontend's dependencies
        run: bun install --frozen-lockfile --registry https://registry.npmjs.org/

      - name: Package
        run: bun run build -- -platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: ressu-${{ runner.os }}
          path: build/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect release assets
        run: |
          mkdir release-assets
          find dist -type f \( \
            -name '*.dmg' -o \
            -name '*-setup-*.exe' -o \
            -name '*.deb' -o \
            -name '*.tar.gz' \
          \) -exec cp {} release-assets/ \;
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          find release-assets -maxdepth 1 -type f -print0 | sort -z | \
            xargs -0 sha256sum > release-assets/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

  release-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate the date-based release version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG_NAME" =~ ^v([0-9]{2})\.(1[0-2]|[1-9])\.([1-9][0-9]*)$ ]]; then
            echo "Release tags must use vYY.M.N, where M is 1-12 and N starts at 1." >&2
            exit 1
          fi

          version="${TAG_NAME#v}"
          package_version="$(jq -er '.version' package.json)"
          if [ "$package_version" != "$version" ]; then
            echo "package.json version is $package_version; expected $version." >&2
            exit 1
          fi

          if ! grep -Fx "  version: \"$version\"," mygo.config.ts; then
            echo "mygo.config.ts must set version to \"$version\"." >&2
            exit 1
          fi
